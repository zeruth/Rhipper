# rhtest on the references Visual Studio 2010 SP1 (cl 16.00.40219) built for x86, /MT, for
# Windows XP, as VS2010 /MT clients are (tests/rhtest/bins/msvc-16.00-x86): rhtest.yml's steps, under this
# toolset's own name and badge.
name: msvc-16.00-x86

# (by hand only while msvc-14.51-x86 works through its programs one at a time, 2026-10-28)
on:
  workflow_dispatch:

# (every push its own run, in parallel: one concurrency group let only the newest waiting run
# through, and the commits between never had a result. pages.py keeps each run's under its
# commit, history/<toolset>/, and shows the newest commit's whatever order they finish in)

permissions:
  contents: write

jobs:
  rhtest:
    uses: ./.github/workflows/rhtest.yml
    with:
      toolset: msvc-16.00-x86
