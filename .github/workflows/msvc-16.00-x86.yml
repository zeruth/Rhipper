# rhtest on the references Visual Studio 2010 SP1 (cl 16.00.40219) built for x86, /MT, for
# Windows XP, as VS2010 /MT clients are (tests/rhtest/bins/msvc-16.00-x86): rhtest.yml's steps, under this
# toolset's own name and badge.
name: msvc-16.00-x86

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

# (a run finishes: a push queues the next, the newest replacing any still waiting. Cancelled by
# each push, a run longer than the pushes' spacing never published a result)
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rhtest:
    uses: ./.github/workflows/rhtest.yml
    with:
      toolset: msvc-16.00-x86
