# rhtest on the references MSVC 14.51 (Visual Studio 2026) built for x86, /MD
# (tests/rhtest/bins/msvc-14.51-x86): rhtest.yml's steps, under this toolset's own name and badge.
name: msvc-14.51-x86

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

# (every push its own run, in parallel: one concurrency group let only the newest waiting run
# through, and the commits between never had a result. pages.py keeps each run's under its
# commit, history/<toolset>/, and shows the newest commit's whatever order they finish in)

permissions:
  contents: write

jobs:
  rhtest:
    uses: ./.github/workflows/rhtest.yml
    with:
      toolset: msvc-14.51-x86
